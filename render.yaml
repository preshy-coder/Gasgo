databases:
  - name: gasgo-db
    plan: free
    databaseName: gasgo
    user: gasgo

services:
  - type: web
    name: gasgo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gasgo-db
          property: connectionString
      - key: MPESA_ENV
        value: sandbox
      - key: ENABLE_TEST_TOOLS
        value: "True"
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: MPESA_CALLBACK_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false